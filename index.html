<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>修繕依頼フォーム｜準備中</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem 1.25rem 3rem;
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.9;
    font-size: 16px;
    background: #fff;
    color: #1a1a1a;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.35rem; line-height: 1.6; margin: 0 0 .25rem; }
  .lead { font-size: 1rem; color: #555; margin: 0 0 2rem; }
  section { margin: 0 0 1.75rem; }
  h2 { font-size: 1rem; margin: 0 0 .5rem; }
  p { margin: 0 0 .75rem; }
  .box {
    border: 1px solid #d8d8d8;
    border-radius: .5rem;
    padding: 1rem 1.1rem;
    background: #fafafa;
  }
  .date { font-weight: 700; }
  dl { margin: 0; }
  dt { font-size: .875rem; color: #555; margin-top: .75rem; }
  dt:first-child { margin-top: 0; }
  dd { margin: 0 0 0; font-weight: 600; }
  dd a { color: inherit; }
  footer {
    margin-top: 2.5rem; padding-top: 1rem;
    border-top: 1px solid #e5e5e5;
    font-size: .8125rem; color: #666;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #141414; color: #ededed; }
    .lead, dt, footer { color: #a6a6a6; }
    .box { background: #1d1d1d; border-color: #333; }
    footer { border-top-color: #2e2e2e; }
  }
</style>
</head>
<body>
<main>

  <h1>修繕依頼フォーム</h1>
  <p class="lead">ただいま準備中です。</p>

  <section class="box">
    <p><span class="date">2026年9月1日</span>より、このページから
       社宅・寮の修繕のご依頼を受け付けます。</p>
    <p>このページのアドレスは変わりません。ブックマークしていただけます。</p>
  </section>

  <section>
    <h2>それまでの間のご依頼について</h2>
    <p>8月31日までは、これまでどおりのお申し込み方法をご利用ください。</p>
  </section>

  <footer>
    パソナ 社宅管理チーム
  </footer>

</main>
</body>
</html>
